# Golden set de recuperación (etapa 3). Preguntas legítimas por rol, con las palabras clave
# que entregaría el agente y los documentos que deberían aparecer entre los k = 5 primeros.
# Todos los esperados están autorizados para la persona según documents/MATRIZ_ACCESO.md.
# Se usará también en la etapa 6 para medir la tasa de denegación falsa.
# Una persona por rol: Sofía (empleado, financiera), Carlos (supervisor, académica, con la
# etiqueta comite_disciplinario) y Diego (administrador, sin etiquetas).
