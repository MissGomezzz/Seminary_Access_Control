name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_CLIENT: mock
      # Base efímera del servicio de CI. Estas claves no protegen nada fuera del job
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: acxes
      POSTGRES_USER: acxes_owner
      POSTGRES_PASSWORD: ci_owner_efimera
      POSTGRES_APP_PASSWORD: ci_app_efimera
      POSTGRES_AUDIT_PASSWORD: ci_audit_efimera
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: acxes
          POSTGRES_USER: acxes_owner
          POSTGRES_PASSWORD: ci_owner_efimera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acxes_owner -d acxes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Aplicar esquema, roles, RLS y datos provisionales
        run: python -m acxes.db.apply
      - run: pytest
