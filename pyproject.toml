[project]
name = "acxes"
version = "0.0.1"
description = "Implementación de referencia de control de acceso para un agente de IA institucional"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["acxes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requiere PostgreSQL con el esquema aplicado (python -m acxes.db.apply)",
    "llm_real: llama al modelo real y requiere clave, se omite sin ella",
]

[tool.ruff]
line-length = 100
target-version = "py312"
